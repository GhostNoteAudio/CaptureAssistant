<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Audio Capture Assistant</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.35;
      background: var(--bg, #0b0c10);
      color: #e5e7eb;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { font-size: 20px; margin: 12px 0 20px; }
    fieldset {
      border: 1px solid rgba(127,127,127,.35);
      border-radius: 10px;
      padding: 14px;
      margin: 0 0 16px;
    }
    legend { padding: 0 6px; opacity: .8; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    label { font-size: 13px; opacity: .9; }
    select, input[type="range"], button { 
      font: inherit; 
      padding: 6px 8px; 
      border-radius: 8px; 
      border: 1px solid rgba(127,127,127,.35);
      background: transparent;
      color: inherit;
    }
    select { min-width: 260px; }
    /* Make dropdown text readable: black text on white background, only for selects */
    select { color: #111; background: #fff; }
    option { color: #111; background: #fff; }
    .slider-row { gap: 10px; }
    .slider-row input[type="range"] { width: 220px; }
    .btn-primary { background: #2563eb; color: white; border-color: #1d4ed8; }
    .btn-danger { background: #ef4444; color: white; border-color: #dc2626; }
    .btn-secondary { background: #334155; color: white; border-color: #334155; }
    .muted { opacity: .8; font-size: 12px; }
    .status { min-height: 20px; padding-top: 6px; font-size: 13px; }
    .spacer { flex: 1 1 auto; }
    /* Filename builder */
    .three-col { display: flex; gap: 12px; align-items: flex-start; }
    .col { flex: 1 1 0; min-width: 0; }
    .col h3 { margin: 0 0 8px; font-size: 14px; opacity: .9; }
    .list { list-style: none; padding: 0; margin: 0 0 10px; max-height: 200px; overflow: auto; border: 1px solid rgba(127,127,127,.35); border-radius: 8px; }
    .item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; cursor: pointer; }
    .item:not(:last-child) { border-bottom: 1px solid rgba(127,127,127,.2); }
    .item.selected { outline: 2px solid #2563eb; outline-offset: -2px; background: rgba(37,99,235,.15); }
    .item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .remove { background: #ef4444; color: #fff; border: 0; border-radius: 6px; padding: 2px 6px; cursor: pointer; font-size: 12px; }
    .adder { display: flex; gap: 8px; }
    .adder input { flex: 1 1 auto; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35); background: #ffffff; color: #111; }
    .adder button { padding: 6px 10px; }
    /* Spectrum */
    .spectrum-wrap { position: relative; }
    .spectrum-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .spectrum-toolbar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
    #spectrumCanvas { width: 100%; height: 280px; background: #0a0f1a; border: 1px solid rgba(127,127,127,.35); border-radius: 8px; display: block; }
    .btn-reset { background: #475569; color: #fff; border-color: #334155; }
    .col-name { cursor: text; }
  </style>
  <meta http-equiv="origin-trial" content="">
  <!-- All logic inlined below -->
  <script>
    // Utility: UI helpers
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    // Core state
    let audioContext = null;
    let masterGain = null;
    let outputDest = null;           // MediaStreamDestination
    let outputAudioEl = null;         // <audio> that plays outputDest
    let generatorNode = null;         // AudioWorkletNode producing test signals
    let recorderNode = null;          // AudioWorkletNode capturing input
    let inputStream = null;           // MediaStream for selected input
    let inputSourceNode = null;       // MediaStreamAudioSourceNode from inputStream
    let initialized = false;
    let isPlayingTest = false;
    let directOutConnected = false;   // whether masterGain is connected to destination
    let isRecording = false;
    let recordingTimer = null;
    let startCaptureTimer = null;
    let recordTargetSamples = 0;
    let recordWriteIndex = 0;
    let recordBuffer = null;          // Float32Array pre-allocated for 5s
    const FILENAME_STORE_KEY = 'ca-filename-columns-v1';
    let filenameColumns = [[], [], []]; // entries per column
    let filenameColumnNames = ['Column 1', 'Column 2', 'Column 3'];
    let selectedIndices = [null, null, null]; // selected index per column (or null)
    // Spectrum state
    let spectrumSamples = null; // Float32 samples of last recording
    let spectrumFftSize = 4096;
    let viewXMin = 20;      // Hz
    let viewXMax = 24000;   // Hz
    let viewYMin = -120;    // dB
    let viewYMax = 0;       // dB
    let isPanning = false;
    let panStart = null;
    let showImpulse = false; // false = spectrum view, true = impulse response view

    // Capability checks
    const canSelectOutput = () => typeof HTMLMediaElement !== 'undefined' && 'setSinkId' in HTMLMediaElement.prototype;

    // Worklet code (inline via Blob URLs to keep single-file)
    function makeWorkletURL(code) {
      const blob = new Blob([code], { type: 'application/javascript' });
      return URL.createObjectURL(blob);
    }

    const generatorWorkletCode = `
class TestSignalProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.enabled = false;
    this.mode = 'sine'; // 'sine' | 'white' | 'pink'
    this.freq = 1000;
    this.phase = 0;
    this.twoPi = Math.PI * 2;
    // Pink noise state (Paul Kellet method)
    this.b0 = 0; this.b1 = 0; this.b2 = 0; this.b3 = 0; this.b4 = 0; this.b5 = 0; this.b6 = 0;
    this.port.onmessage = (ev) => {
      const m = ev.data || {};
      if (m.type === 'config') {
        if (typeof m.enabled === 'boolean') this.enabled = m.enabled;
        if (m.mode) this.mode = m.mode;
        if (typeof m.freq === 'number') this.freq = m.freq;
      }
    };
  }
  process(_inputs, outputs, _params) {
    const output = outputs[0];
    if (!output || output.length === 0) return true;
    const ch0 = output[0];
    const len = ch0.length;
    if (!this.enabled) {
      for (let i = 0; i < len; i++) ch0[i] = 0;
      return true;
    }
    if (this.mode === 'sine') {
      const incr = this.twoPi * this.freq / sampleRate;
      for (let i = 0; i < len; i++) {
        ch0[i] = Math.sin(this.phase);
        this.phase += incr;
        if (this.phase > this.twoPi) this.phase -= this.twoPi;
      }
    } else if (this.mode === 'white') {
      for (let i = 0; i < len; i++) {
        ch0[i] = Math.random() * 2 - 1;
      }
    } else { // pink
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        this.b0 = 0.99886 * this.b0 + white * 0.0555179;
        this.b1 = 0.99332 * this.b1 + white * 0.0750759;
        this.b2 = 0.96900 * this.b2 + white * 0.1538520;
        this.b3 = 0.86650 * this.b3 + white * 0.3104856;
        this.b4 = 0.55000 * this.b4 + white * 0.5329522;
        this.b5 = -0.7616 * this.b5 - white * 0.0168980;
        this.b6 = white * 0.115926;
        let pink = this.b0 + this.b1 + this.b2 + this.b3 + this.b4 + this.b5 + this.b6 + white * 0.5362;
        pink *= 0.11; // normalize roughly to [-1,1]
        // simple clamp
        if (pink > 1) pink = 1; else if (pink < -1) pink = -1;
        ch0[i] = pink;
      }
    }
    return true;
  }
}
registerProcessor('test-signal-processor', TestSignalProcessor);
`;

    const recorderWorkletCode = `
class RecorderProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.recording = false;
    this.port.onmessage = (ev) => {
      const m = ev.data || {};
      if (m.type === 'set-recording') {
        this.recording = !!m.enabled;
      }
    };
  }
  process(inputs, _outputs, _params) {
    const input = inputs[0];
    if (!input || input.length === 0) return true;
    const ch0 = input[0];
    const frames = ch0.length;
    // Downmix to mono if multiple channels
    let mono;
    if (input.length === 1) {
      mono = ch0;
    } else {
      mono = new Float32Array(frames);
      for (let c = 0; c < input.length; c++) {
        const ch = input[c];
        for (let i = 0; i < frames; i++) mono[i] += ch[i];
      }
      const inv = 1 / input.length;
      for (let i = 0; i < frames; i++) mono[i] *= inv;
    }
    if (this.recording) {
      // Transferable ArrayBuffer to avoid copying on main thread
      const copy = new Float32Array(mono.length);
      copy.set(mono);
      this.port.postMessage({ type: 'data', buffer: copy.buffer }, [copy.buffer]);
    }
    return true;
  }
}
registerProcessor('recorder-processor', RecorderProcessor);
`;

    // Initialization
    async function initAudioIfNeeded() {
      if (initialized) return;
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      // Load worklets
      await audioContext.audioWorklet.addModule(makeWorkletURL(generatorWorkletCode));
      await audioContext.audioWorklet.addModule(makeWorkletURL(recorderWorkletCode));

      // Output path: generator -> masterGain -> MediaStreamDestination -> <audio>
      masterGain = audioContext.createGain();
      masterGain.gain.value = parseFloat($('#volume').value);
      outputDest = audioContext.createMediaStreamDestination();
      masterGain.connect(outputDest);

      // Create generator node (mono output)
      generatorNode = new AudioWorkletNode(audioContext, 'test-signal-processor', { outputChannelCount: [1] });
      generatorNode.connect(masterGain);

      // Create recorder node (input only, no outputs)
      recorderNode = new AudioWorkletNode(audioContext, 'recorder-processor', { numberOfInputs: 1, numberOfOutputs: 0 });
      recorderNode.port.onmessage = onRecorderMessage;

      // Audio element for routing to selected output device
      outputAudioEl = document.createElement('audio');
      outputAudioEl.autoplay = true;
      outputAudioEl.playsInline = true;
      outputAudioEl.muted = false;
      outputAudioEl.srcObject = outputDest.stream;
      outputAudioEl.style.display = 'none';
      document.body.appendChild(outputAudioEl);

      // Try to start audio (user gesture usually needed when clicking buttons)
      try { await outputAudioEl.play(); } catch (e) { /* ignore */ }

      initialized = true;
    }

    // Device management
    async function ensureDeviceAccess() {
      try {
        // Request mic once to reveal device labels
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        setStatus(`Microphone permission denied or unavailable. ${err?.message || ''}`);
      }
    }

    async function refreshDevices() {
      if (!navigator.mediaDevices?.enumerateDevices) return;
      const devices = await navigator.mediaDevices.enumerateDevices();
      const inputs = devices.filter(d => d.kind === 'audioinput').sort((a,b)=> (a.label||'').localeCompare(b.label||''));
      const outputs = devices.filter(d => d.kind === 'audiooutput').sort((a,b)=> (a.label||'').localeCompare(b.label||''));
      const inputSel = $('#inputDevice');
      const outputSel = $('#outputDevice');

      // Remember selections
      const prevIn = inputSel.value || localStorage.getItem('ca-selected-input') || '';
      const prevOut = outputSel.value || localStorage.getItem('ca-selected-output') || '';

      // Populate input devices
      inputSel.innerHTML = '';
      for (const d of inputs) {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Input ${inputSel.length + 1}`;
        inputSel.appendChild(opt);
      }
      if (inputs.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No input devices found';
        inputSel.appendChild(opt);
      }

      // Populate output devices
      outputSel.innerHTML = '';
      for (const d of outputs) {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Output ${outputSel.length + 1}`;
        outputSel.appendChild(opt);
      }
      if (outputs.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'Default system output';
        outputSel.appendChild(opt);
      }

      // Restore if possible
      if ([...inputSel.options].some(o => o.value === prevIn)) inputSel.value = prevIn;
      if ([...outputSel.options].some(o => o.value === prevOut)) outputSel.value = prevOut;

      // Apply sink to current audio element
      await applyOutputSink();
    }

    async function applyOutputSink() {
      if (!outputAudioEl) return;
      const outId = $('#outputDevice').value;
      if (canSelectOutput() && outId) {
        try { await outputAudioEl.setSinkId(outId); }
        catch (e) { setStatus(`Cannot set output device: ${e?.message || e}`); }
      }
      updateOutputRouting();
    }

    // Input stream setup
    async function startInput(deviceId) {
      stopInput();
      const constraints = {
        audio: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          channelCount: 1,
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      };
      try {
        inputStream = await navigator.mediaDevices.getUserMedia(constraints);
        inputSourceNode = audioContext.createMediaStreamSource(inputStream);
        inputSourceNode.connect(recorderNode);
      } catch (err) {
        setStatus(`Failed to access input device: ${err?.message || err}`);
      }
    }

    function stopInput() {
      try { if (inputSourceNode) inputSourceNode.disconnect(); } catch {}
      inputSourceNode = null;
      if (inputStream) {
        inputStream.getTracks().forEach(t => t.stop());
        inputStream = null;
      }
    }

    // Generator control
    async function configureGenerator() {
      const mode = $('#signalType').value; // 'sine' | 'white' | 'pink'
      const freq = 1000; // fixed per requirements
      generatorNode.port.postMessage({ type: 'config', mode, freq, enabled: isPlayingTest });
      masterGain.gain.value = parseFloat($('#volume').value);
      await applyOutputSink();
    }

    function setGeneratorPlaying(on) {
      isPlayingTest = !!on;
      generatorNode.port.postMessage({ type: 'config', enabled: isPlayingTest });
      updateOutputRouting();
      updatePlayButtonLabel();
    }

    // Recorder messaging
    function onRecorderMessage(ev) {
      const m = ev.data || {};
      if (m.type === 'data' && recordBuffer) {
        const chunk = new Float32Array(m.buffer);
        const remaining = recordTargetSamples - recordWriteIndex;
        if (remaining <= 0) return;
        const toCopy = Math.min(remaining, chunk.length);
        recordBuffer.set(chunk.subarray(0, toCopy), recordWriteIndex);
        recordWriteIndex += toCopy;
        if (recordWriteIndex >= recordTargetSamples) {
          // we reached target length; stop now
          stopRecordingFlow();
        }
      }
    }

    function startRecordingFlow() {
      if (isRecording) return;
      if (!initialized) {
        // Should not happen since record button initializes, but guard anyway
        setStatus('Audio not initialized.');
        return;
      }
      const sr = audioContext.sampleRate;
      recordTargetSamples = Math.round(sr * 5);
      recordBuffer = new Float32Array(recordTargetSamples);
      recordWriteIndex = 0;
      isRecording = true;
      $('#recordBtn').disabled = true;
      setStatus('Starting test signal...');

      // Start test signal immediately
      setGeneratorPlaying(true);
      configureGenerator();

      // Start capture after 0.5 seconds
      startCaptureTimer = setTimeout(() => {
        recorderNode.port.postMessage({ type: 'set-recording', enabled: true });
        setStatus('Recording for 5 seconds...');
        // Also set a hard timeout in case we don't hit exact samples
        recordingTimer = setTimeout(() => stopRecordingFlow(), 5000 + 100 /* guard */);
      }, 500);
    }

    function stopRecordingFlow() {
      if (!isRecording) return;
      isRecording = false;
      try { recorderNode.port.postMessage({ type: 'set-recording', enabled: false }); } catch {}
      if (startCaptureTimer) { clearTimeout(startCaptureTimer); startCaptureTimer = null; }
      if (recordingTimer) { clearTimeout(recordingTimer); recordingTimer = null; }

      // Stop test signal
      setGeneratorPlaying(false);

      // Finalize buffer length
      const finalSamples = Math.min(recordWriteIndex, recordTargetSamples);
      const finalBuf = finalSamples === recordTargetSamples ? recordBuffer : recordBuffer.slice(0, finalSamples);

      // Encode and download
      const wavBlob = encodeWav24(finalBuf, audioContext.sampleRate);
      // Save samples for spectrum
      spectrumSamples = finalBuf;
      drawSpectrum();
      const base = buildFilenameBase();
      const ts = new Date().toISOString().replace(/[:.]/g, '-');
      const fname = `${base || `capture_${ts}`}.wav`;
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      const beforeSize = performance.now();
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      // Delay status update slightly to reduce chance of showing when user cancels
      setTimeout(() => {
        // We cannot reliably detect cancel, so only show a neutral message
        setStatus(`Export prepared: ${fname}`);
      }, 200);

      $('#recordBtn').disabled = false;
      // No success message; neutral info is set above after triggering download
      updatePlayButtonLabel();
    }

    // WAV encoding (24-bit PCM, mono)
    function encodeWav24(float32Data, sampleRate) {
      const numChannels = 1;
      const bitsPerSample = 24;
      const blockAlign = numChannels * (bitsPerSample / 8);
      const byteRate = sampleRate * blockAlign;
      const dataBytes = float32Data.length * blockAlign; // 3 bytes per sample
      const buffer = new ArrayBuffer(44 + dataBytes);
      const view = new DataView(buffer);

      // RIFF header
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataBytes, true);
      writeString(view, 8, 'WAVE');

      // fmt chunk
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);           // Subchunk1Size
      view.setUint16(20, 1, true);            // AudioFormat = PCM
      view.setUint16(22, numChannels, true);  // NumChannels
      view.setUint32(24, sampleRate, true);   // SampleRate
      view.setUint32(28, byteRate, true);     // ByteRate
      view.setUint16(32, blockAlign, true);   // BlockAlign
      view.setUint16(34, bitsPerSample, true);// BitsPerSample

      // data chunk
      writeString(view, 36, 'data');
      view.setUint32(40, dataBytes, true);

      // PCM 24-bit little endian
      let offset = 44;
      for (let i = 0; i < float32Data.length; i++) {
        let s = Math.max(-1, Math.min(1, float32Data[i]));
        // Scale to signed 24-bit
        let int = s < 0 ? Math.round(s * 0x800000) : Math.round(s * 0x7FFFFF);
        // Write 3 bytes LE
        view.setUint8(offset + 0, int & 0xFF);
        view.setUint8(offset + 1, (int >> 8) & 0xFF);
        view.setUint8(offset + 2, (int >> 16) & 0xFF);
        offset += 3;
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    function writeString(dataview, offset, str) {
      for (let i = 0; i < str.length; i++) {
        dataview.setUint8(offset + i, str.charCodeAt(i));
      }
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function setStatus(text) {
      $('#status').textContent = text || '';
    }

    // UI wiring
    async function onInitDevicesClick() {
      await initAudioIfNeeded();
      await ensureDeviceAccess();
      await refreshDevices();
      setStatus('Devices initialized. Choose input/output, then press Record.');
    }

    async function onRecordClick() {
      await initAudioIfNeeded();
      // Ensure we have at least default input
      const inId = $('#inputDevice').value;
      if (!inputStream) await startInput(inId);
      // Ensure sink
      await applyOutputSink();
      // Resume context to be safe
      try { await audioContext.resume(); } catch {}
      // Ensure the hidden audio element is actually playing (user gesture context)
      try { await outputAudioEl.play(); } catch {}
      startRecordingFlow();
    }

    async function onPlayToggleClick() {
      await initAudioIfNeeded();
      const newState = !isPlayingTest;
      setGeneratorPlaying(newState);
      await configureGenerator();
      // Ensure audio context and HTMLMediaElement are playing under user gesture
      try { await audioContext.resume(); } catch {}
      try { await outputAudioEl.play(); } catch {}
      updatePlayButtonLabel();
      setStatus(newState ? 'Playing test signal...' : '');
    }

    function bindUI() {
      $('#initBtn').addEventListener('click', onInitDevicesClick);
      $('#recordBtn').addEventListener('click', onRecordClick);
      $('#playBtn').addEventListener('click', onPlayToggleClick);
      $('#signalType').addEventListener('change', configureGenerator);
      $('#volume').addEventListener('input', () => { if (masterGain) masterGain.gain.value = parseFloat($('#volume').value); });
      $('#inputDevice').addEventListener('change', async (e) => { await initAudioIfNeeded(); localStorage.setItem('ca-selected-input', e.target.value || ''); await startInput(e.target.value); });
      $('#outputDevice').addEventListener('change', async (e) => { await initAudioIfNeeded(); localStorage.setItem('ca-selected-output', e.target.value || ''); await applyOutputSink(); });
      if (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', refreshDevices);

      // Filename builder events
      for (let c = 0; c < 3; c++) {
        const addBtn = document.getElementById(`btnAdd${c}`);
        const addInput = document.getElementById(`add${c}`);
        addBtn.addEventListener('click', () => addEntry(c));
        addInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addEntry(c); } });
        // Column name editing events (persist, prevent newlines)
        const nameEl = document.getElementById(`colName${c}`);
        if (nameEl) {
          const commit = () => {
            const txt = (nameEl.textContent || '').replace(/\n+/g, ' ').trim() || `Column ${c+1}`;
            filenameColumnNames[c] = txt;
            nameEl.textContent = txt;
            saveFilenameColumns();
          };
          nameEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
          });
          nameEl.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData?.getData('text') || '').replace(/\n+/g, ' ');
            document.execCommand('insertText', false, text);
          });
          nameEl.addEventListener('blur', commit);
        }
      }

      // Spectrum events
      const fftSlider = document.getElementById('fftSize');
      const fftLabel = document.getElementById('fftLabel');
      const fftOptions = [1024, 2048, 4096, 8192, 16384, 32768];
      fftLabel.textContent = String(fftOptions[parseInt(fftSlider.value, 10)]);
      spectrumFftSize = fftOptions[parseInt(fftSlider.value, 10)];
      fftSlider.addEventListener('input', () => {
        const idx = Math.max(0, Math.min(fftOptions.length - 1, parseInt(fftSlider.value, 10) || 0));
        spectrumFftSize = fftOptions[idx];
        fftLabel.textContent = String(spectrumFftSize);
        drawSpectrum();
      });
      const smoothSlider = document.getElementById('smoothSize');
      const smoothLabel = document.getElementById('smoothLabel');
      smoothSlider.addEventListener('input', () => {
        smoothLabel.textContent = String(smoothSlider.value);
        drawSpectrum();
      });
      document.getElementById('resetView').addEventListener('click', () => resetSpectrumView());
      document.getElementById('toggleView').addEventListener('click', () => {
        showImpulse = !showImpulse;
        document.getElementById('toggleView').textContent = showImpulse ? 'Show Spectrum' : 'Show Impulse';
        drawSpectrum();
      });

      initSpectrumCanvasInteractions();
    }

    window.addEventListener('DOMContentLoaded', () => {
      bindUI();
      // Attempt to init devices proactively; if permission blocked, user can press Initialize
      (async () => {
        try {
          await initAudioIfNeeded();
          await ensureDeviceAccess();
          await refreshDevices();
          setStatus('Ready.');
          updatePlayButtonLabel();
          // Load filename lists
          loadFilenameColumns();
          renderFilenameColumns();
        } catch {
          // Silent; user can click Initialize
        }
      })();
    });

    function updatePlayButtonLabel() {
      const btn = document.getElementById('playBtn');
      if (!btn) return;
      btn.textContent = isPlayingTest ? 'Stop Test Signal' : 'Play Test Signal';
    }

    // ===== Filename builder logic =====
    function loadFilenameColumns() {
      try {
        const raw = localStorage.getItem(FILENAME_STORE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.columns) && data.columns.length === 3 && data.columns.every(col => Array.isArray(col))) {
          filenameColumns = data.columns.map(col => col.map(v => String(v)));
        } else if (Array.isArray(data) && data.length === 3) { // backward compatibility
          filenameColumns = data.map(col => col.map(v => String(v)));
        }
        if (data && Array.isArray(data.names) && data.names.length === 3) {
          filenameColumnNames = data.names.map(v => String(v) || '');
        }
      } catch {}
    }

    function saveFilenameColumns() {
      const payload = { columns: filenameColumns, names: filenameColumnNames };
      try { localStorage.setItem(FILENAME_STORE_KEY, JSON.stringify(payload)); } catch {}
    }

    function renderFilenameColumns() {
      for (let c = 0; c < 3; c++) {
        const listEl = document.getElementById(`col${c}`);
        listEl.innerHTML = '';
        const col = filenameColumns[c] || [];
        const nameEl = document.getElementById(`colName${c}`);
        if (nameEl) nameEl.textContent = filenameColumnNames[c] || `Column ${c+1}`;
        if (col.length === 0) {
          const li = document.createElement('li');
          li.className = 'item';
          const span = document.createElement('span');
          span.className = 'label';
          span.textContent = '(empty)';
          li.appendChild(span);
          li.style.opacity = .7;
          listEl.appendChild(li);
        } else {
          col.forEach((val, idx) => {
            const li = document.createElement('li');
            li.className = 'item' + (selectedIndices[c] === idx ? ' selected' : '');
            const span = document.createElement('span');
            span.className = 'label';
            span.textContent = val;
            const rm = document.createElement('button');
            rm.className = 'remove';
            rm.type = 'button';
            rm.textContent = 'Remove';
            rm.addEventListener('click', (e) => { e.stopPropagation(); removeEntry(c, idx); });
            li.addEventListener('click', () => toggleSelect(c, idx));
            li.appendChild(span);
            li.appendChild(rm);
            listEl.appendChild(li);
          });
        }
      }
    }

    function addEntry(colIndex) {
      const input = document.getElementById(`add${colIndex}`);
      const value = (input.value || '').trim();
      if (!value) return;
      filenameColumns[colIndex] = filenameColumns[colIndex] || [];
      filenameColumns[colIndex].push(value);
      input.value = '';
      saveFilenameColumns();
      renderFilenameColumns();
    }

    function removeEntry(colIndex, idx) {
      const col = filenameColumns[colIndex];
      if (!col) return;
      col.splice(idx, 1);
      // Adjust selection
      if (selectedIndices[colIndex] === idx) selectedIndices[colIndex] = null;
      else if (selectedIndices[colIndex] != null && selectedIndices[colIndex] > idx) selectedIndices[colIndex]--;
      saveFilenameColumns();
      renderFilenameColumns();
    }

    function toggleSelect(colIndex, idx) {
      if (selectedIndices[colIndex] === idx) selectedIndices[colIndex] = null; else selectedIndices[colIndex] = idx;
      renderFilenameColumns();
    }

    function buildFilenameBase() {
      const parts = [];
      for (let c = 0; c < 3; c++) {
        const idx = selectedIndices[c];
        if (idx != null && filenameColumns[c] && filenameColumns[c][idx] != null) {
          const val = String(filenameColumns[c][idx]).trim();
          if (val) parts.push(sanitizeFilenamePart(val));
        }
      }
      if (parts.length === 0) return '';
      return parts.join('-');
    }

    // (moved) Persist column name edits: bound in bindUI after DOM exists

    function sanitizeFilenamePart(s) {
      // Remove characters not allowed in filenames on Windows/macOS
      return s.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim();
    }

    // ===== Spectrum computation and drawing =====
    function hammingWindow(N) {
      const w = new Float32Array(N);
      const twoPiOverNMinus1 = Math.PI * 2 / (N - 1);
      for (let n = 0; n < N; n++) w[n] = 0.54 - 0.46 * Math.cos(twoPiOverNMinus1 * n);
      return w;
    }

    function computeSpectrum(samples, sampleRate, fftSize) {
      if (!samples || samples.length === 0) return { freq: [], magDb: [] };
      const N = fftSize >>> 0;
      const hop = Math.max(1, Math.floor(N / 2)); // 50% overlap
      const window = hammingWindow(N);
      const numFrames = Math.max(1, Math.floor((samples.length - N) / hop) + 1);
      const re = new Float32Array(N);
      const im = new Float32Array(N);
      const magAccum = new Float32Array(N >> 1);
      for (let frame = 0; frame < numFrames; frame++) {
        const start = frame * hop;
        for (let n = 0; n < N; n++) {
          const s = samples[start + n] || 0;
          re[n] = s * window[n];
          im[n] = 0;
        }
        fftRadix2(re, im);
        for (let k = 1; k < (N >> 1); k++) {
          const mr = re[k], mi = im[k];
          const mag = Math.hypot(mr, mi) / (N >> 1);
          magAccum[k] += mag;
        }
      }
      for (let k = 1; k < (N >> 1); k++) magAccum[k] /= numFrames;
      const len = N >> 1;
      const freq = new Float32Array(len);
      const magDb = new Float32Array(len);
      for (let k = 1; k < len; k++) {
        freq[k] = k * sampleRate / N;
        magDb[k] = 20 * Math.log10(magAccum[k] + 1e-12);
      }
      return { freq, magDb };
    }

    // In-place radix-2 Cooley–Tukey FFT (real/imag arrays), N must be power of two
    function fftRadix2(re, im) {
      const N = re.length;
      // bit reversal
      for (let i = 0, j = 0; i < N; i++) {
        if (i < j) { const tr = re[i]; re[i] = re[j]; re[j] = tr; const ti = im[i]; im[i] = im[j]; im[j] = ti; }
        let m = N >>> 1;
        while (j >= m && m >= 2) { j -= m; m >>>= 1; }
        j += m;
      }
      for (let size = 2; size <= N; size <<= 1) {
        const half = size >>> 1;
        const theta = -2 * Math.PI / size;
        const wpr = Math.cos(theta);
        const wpi = Math.sin(theta);
        for (let i = 0; i < N; i += size) {
          let wr = 1, wi = 0;
          for (let j = 0; j < half; j++) {
            const l = i + j;
            const r = l + half;
            const tr = wr * re[r] - wi * im[r];
            const ti = wr * im[r] + wi * re[r];
            re[r] = re[l] - tr;
            im[r] = im[l] - ti;
            re[l] += tr;
            im[l] += ti;
            const wnr = wr * wpr - wi * wpi;
            wi = wr * wpi + wi * wpr;
            wr = wnr;
          }
        }
      }
    }

    function drawSpectrum() {
      const canvas = document.getElementById('spectrumCanvas');
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(300, Math.floor(rect.width * dpr));
      const height = Math.max(180, Math.floor(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#0a0f1a';
      ctx.fillRect(0, 0, width, height);
      ctx.font = `${12 * dpr}px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial`;
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(229,231,235,0.8)';
      if (!showImpulse) {
        // Frequency-domain view
        drawSpectrumGrid(ctx, width, height);
        if (!spectrumSamples) { ctx.restore(); return; }
        const sr = audioContext ? audioContext.sampleRate : 48000;
        let { freq, magDb } = computeSpectrum(spectrumSamples, sr, spectrumFftSize);
        const smoothSlider = document.getElementById('smoothSize');
        const smoothFactor = smoothSlider ? (parseInt(smoothSlider.value, 10) || 0) / 100 : 0;
        if (smoothFactor > 0) {
          magDb = applyFrequencySmoothing(freq, magDb, smoothFactor);
        }
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#34d399';
        ctx.beginPath();
        let moved = false;
        for (let i = 1; i < freq.length; i++) {
          const f = freq[i];
          if (f < viewXMin || f > viewXMax) continue;
          const d = magDb[i];
          const x = mapLog(f, viewXMin, viewXMax, 0, width);
          const y = mapLinear(d, viewYMax, viewYMin, 0, height);
          if (!moved) { ctx.moveTo(x, y); moved = true; } else { ctx.lineTo(x, y); }
        }
        ctx.stroke();
      } else {
        // Time-domain impulse response (minimum-phase) view
        if (!spectrumSamples) { ctx.restore(); return; }
        const sr = audioContext ? audioContext.sampleRate : 48000;
        let { freq, magDb } = computeSpectrum(spectrumSamples, sr, spectrumFftSize);
        const smoothSlider = document.getElementById('smoothSize');
        const smoothFactor = smoothSlider ? (parseInt(smoothSlider.value, 10) || 0) / 100 : 0;
        if (smoothFactor > 0) { magDb = applyFrequencySmoothing(freq, magDb, smoothFactor); }
        // Build minimum-phase impulse from magnitude response
        const ir = buildMinimumPhaseIRFromMag(freq, magDb, sr);
        // Draw impulse normalized
        const N = ir.length;
        let maxAbs = 1e-9;
        for (let i = 0; i < N; i++) maxAbs = Math.max(maxAbs, Math.abs(ir[i]));
        ctx.strokeStyle = '#60a5fa';
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
          const x = i / (N - 1) * width;
          const y = height / 2 - (ir[i] / maxAbs) * (height * 0.45);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawSpectrumGrid(ctx, width, height) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.fillStyle = 'rgba(229,231,235,0.7)';
      ctx.lineWidth = 1;
      // dB grid lines
      const step = 10;
      const startDb = Math.ceil(viewYMin / step) * step;
      for (let db = startDb; db <= viewYMax; db += step) {
        const y = mapLinear(db, viewYMax, viewYMin, 0, height);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        ctx.fillText(`${db} dB`, 4, Math.max(0, y - 12));
      }
      // Frequency lines
      const freqs = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
      freqs.forEach(f => {
        if (f < viewXMin || f > viewXMax) return;
        const x = mapLog(f, viewXMin, viewXMax, 0, width);
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        const label = f >= 1000 ? `${(f/1000)}k` : `${f}`;
        ctx.fillText(`${label} Hz`, Math.min(width - 60, x + 4), 2);
      });
      ctx.restore();
    }

    function mapLog(value, inMin, inMax, outMin, outMax) {
      const v = Math.max(inMin, Math.min(inMax, value));
      const a = Math.log10(inMin);
      const b = Math.log10(inMax);
      const t = (Math.log10(v) - a) / (b - a);
      return outMin + t * (outMax - outMin);
    }
    function mapLinear(value, inMin, inMax, outMin, outMax) {
      const t = (value - inMin) / (inMax - inMin);
      return outMin + t * (outMax - outMin);
    }

    function initSpectrumCanvasInteractions() {
      const canvas = document.getElementById('spectrumCanvas');
      if (!canvas) return;
      let lastX = 0, lastY = 0;
      canvas.addEventListener('mousedown', (e) => {
        isPanning = true; panStart = { x: e.clientX, y: e.clientY }; lastX = e.clientX; lastY = e.clientY;
      });
      window.addEventListener('mouseup', () => { isPanning = false; panStart = null; });
      canvas.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        panView(dx, dy, canvas.width, canvas.height);
        drawSpectrum();
      });
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = Math.pow(1.0015, e.deltaY);
        const px = e.offsetX * (window.devicePixelRatio || 1);
        const py = e.offsetY * (window.devicePixelRatio || 1);
        if (e.shiftKey) {
          zoomViewY(zoomFactor, py, canvas.height);
        } else {
          zoomViewX(zoomFactor, px, canvas.width);
        }
        drawSpectrum();
      }, { passive: false });
    }

    function panView(dx, dy, width, height) {
      // Horizontal pan in log domain
      const logMin = Math.log10(viewXMin);
      const logMax = Math.log10(viewXMax);
      const logSpan = logMax - logMin;
      const shift = -dx / width * logSpan;
      const newLogMin = logMin + shift;
      const newLogMax = logMax + shift;
      let newXMin = Math.pow(10, newLogMin);
      let newXMax = Math.pow(10, newLogMax);
      if (newXMin >= 10 && newXMax <= 48000) {
        viewXMin = newXMin;
        viewXMax = newXMax;
      }
      // Vertical pan linear in dB
      const dBSpan = viewYMax - viewYMin;
      const dBShift = dy / height * dBSpan;
      viewYMin += dBShift;
      viewYMax += dBShift;
    }

    function zoomViewX(scale, px, width) {
      const logMin = Math.log10(viewXMin);
      const logMax = Math.log10(viewXMax);
      const t = px / width;
      const center = logMin + t * (logMax - logMin);
      const newSpan = (logMax - logMin) * scale;
      const newLogMin = center - t * newSpan;
      const newLogMax = center + (1 - t) * newSpan;
      viewXMin = Math.max(10, Math.pow(10, newLogMin));
      viewXMax = Math.min(48000, Math.pow(10, newLogMax));
    }

    function zoomViewY(scale, py, height) {
      const ty = py / height;
      const centerDb = viewYMax - ty * (viewYMax - viewYMin);
      const newDbSpan = (viewYMax - viewYMin) * scale;
      viewYMin = centerDb - (1 - ty) * newDbSpan;
      viewYMax = centerDb + ty * newDbSpan;
    }

    function resetSpectrumView() {
      viewXMin = 20;
      viewXMax = 24000;
      viewYMin = -120;
      viewYMax = 0;
      const fftSlider = document.getElementById('fftSize');
      const fftLabel = document.getElementById('fftLabel');
      if (fftSlider && fftLabel) { fftSlider.value = String(spectrumFftSize); fftLabel.textContent = String(spectrumFftSize); }
      // Redraw immediately so the change is visible without extra interaction
      drawSpectrum();
    }

    // Build a minimum-phase impulse response from log-magnitude response (in dB)
    // Steps:
    // 1) Interpolate mag to uniform linear frequency bins up to Nyquist
    // 2) Convert dB -> linear magnitude; clamp to avoid zeros
    // 3) Compute log magnitude, Hilbert transform to get minimum-phase
    // 4) Form complex spectrum: H(w) = |H(w)| * exp(j * phase)
    // 5) IFFT to time domain and take real part. Normalize length to convenient power of two
    function buildMinimumPhaseIRFromMag(freqHz, magDb, sampleRate) {
      const nyquist = sampleRate / 2;
      const N = nearestPow2(Math.max(1024, spectrumFftSize));
      const half = N >> 1;
      // Uniform frequency grid 0..Nyquist
      const magLinear = new Float32Array(half + 1);
      // Interpolate dB magnitudes to linear bins
      for (let k = 0; k <= half; k++) {
        const f = (k / half) * nyquist;
        const db = interpDbAt(freqHz, magDb, f);
        const lin = Math.pow(10, db / 20);
        magLinear[k] = Math.max(1e-9, lin);
      }
      // Log magnitude
      const logMag = new Float32Array(half + 1);
      for (let k = 0; k <= half; k++) logMag[k] = Math.log(magLinear[k]);
      // Mirror to full spectrum for real IFFT of log magnitude
      const re = new Float32Array(N);
      const im = new Float32Array(N);
      for (let k = 0; k <= half; k++) re[k] = logMag[k];
      for (let k = 1; k < half; k++) re[N - k] = logMag[k];
      // Hilbert transform via FFT: phase = Hilbert{log |H|}
      fftRadix2(re, im); // FFT
      // Apply Hilbert transformer: multiply positive freqs by -j, negative freqs by +j, DC and Nyquist -> 0
      for (let k = 0; k < N; k++) {
        if (k === 0 || k === half) { re[k] = 0; im[k] = 0; }
        else if (k < half) { const tr = im[k]; const ti = -re[k]; re[k] = tr; im[k] = ti; }
        else { const tr = -im[k]; const ti = re[k]; re[k] = tr; im[k] = ti; }
      }
      // IFFT to get analytic signal of log |H|
      ifftRadix2(re, im);
      // The imaginary part is the minimum-phase angle
      const phase = new Float32Array(half + 1);
      for (let k = 0; k <= half; k++) phase[k] = im[k];
      // Construct complex spectrum H(k) = |H| * e^{j phase}
      const Hr = new Float32Array(N);
      const Hi = new Float32Array(N);
      for (let k = 0; k <= half; k++) {
        const a = magLinear[k];
        Hr[k] = a * Math.cos(phase[k]);
        Hi[k] = a * Math.sin(phase[k]);
      }
      // Hermitian symmetry
      for (let k = 1; k < half; k++) {
        Hr[N - k] = Hr[k];
        Hi[N - k] = -Hi[k];
      }
      // IFFT to time domain
      ifftRadix2(Hr, Hi);
      // Take real part, window leading portion to reduce wrap-around, and normalize
      const ir = new Float32Array(N);
      let maxAbs = 1e-12;
      for (let n = 0; n < N; n++) { ir[n] = Hr[n]; maxAbs = Math.max(maxAbs, Math.abs(ir[n])); }
      for (let n = 0; n < N; n++) ir[n] /= maxAbs;
      return ir;
    }

    function interpDbAt(freqHz, magDb, f) {
      if (!freqHz || !magDb || magDb.length !== freqHz.length) return -120;
      if (f <= freqHz[1]) return magDb[1];
      const last = freqHz.length - 1;
      if (f >= freqHz[last]) return magDb[last];
      // Binary search
      let lo = 1, hi = last;
      while (hi - lo > 1) {
        const mid = (hi + lo) >> 1;
        if (freqHz[mid] < f) lo = mid; else hi = mid;
      }
      const t = (f - freqHz[lo]) / Math.max(1e-12, (freqHz[hi] - freqHz[lo]));
      return magDb[lo] + t * (magDb[hi] - magDb[lo]);
    }

    function nearestPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }

    // IFFT via using FFT with conjugation and 1/N scaling
    function ifftRadix2(re, im) {
      const N = re.length;
      for (let i = 0; i < N; i++) im[i] = -im[i];
      fftRadix2(re, im);
      for (let i = 0; i < N; i++) { re[i] = re[i] / N; im[i] = -im[i] / N; }
    }

    // Apply smoothing based on provided C++ algorithm (translated to JS)
    // getWindow(idx, smoothing): raised cosine window whose width grows ~ log2(1+idx) * smoothing
    function applyFrequencySmoothing(_freq, magDb, smoothFactor) {
      const N = magDb.length;
      if (!N || smoothFactor <= 0) return magDb;
      const out = new Float32Array(N);
      const getWindow = (idx, smoothing) => {
        const width = Math.log2(1 + idx) * smoothing;
        if (width <= 1) return [1.0];
        const output = [1.0];
        for (let j = 1; j < 100; j++) {
          const dx = j * Math.PI / width;
          if (dx > Math.PI) break;
          const value = 0.5 * (1 + Math.cos(dx));
          output.push(value);
        }
        return output;
      };
      const s = smoothFactor * 4; // per C++: getWindow(i, smoothing * 4)
      for (let i = 0; i < N; i++) {
        const win = getWindow(i, s);
        let sum = magDb[i];
        let weightSum = 1.0;
        for (let j = 1; j < win.length; j++) {
          const w = win[j];
          const idxLow = i - j;
          const idxHigh = i + j;
          if (idxLow >= 0) { sum += w * magDb[idxLow]; weightSum += w; }
          if (idxHigh < N) { sum += w * magDb[idxHigh]; weightSum += w; }
        }
        out[i] = sum / weightSum;
      }
      return out;
    }

    // Output routing fallback: connect to default system output when sink selection
    // is unavailable or not chosen, otherwise use the HTMLMediaElement route only.
    function updateOutputRouting() {
      const wantDirect = !canSelectOutput() || !$('#outputDevice').value;
      ensureDirectOutputConnected(wantDirect && isPlayingTest);
      if (outputAudioEl) outputAudioEl.muted = wantDirect && isPlayingTest; // avoid double-audio
    }

    function ensureDirectOutputConnected(shouldConnect) {
      if (!audioContext || !masterGain) return;
      try {
        if (shouldConnect && !directOutConnected) {
          masterGain.connect(audioContext.destination);
          directOutConnected = true;
        } else if (!shouldConnect && directOutConnected) {
          masterGain.disconnect(audioContext.destination);
          directOutConnected = false;
        }
      } catch {}
    }
  </script>
</head>
<body>
  <div class="wrap">
    <h1>Capture Assistant</h1>

    <fieldset>
      <legend>Test Signal</legend>
      <div class="row">
        <label for="signalType">Signal</label>
        <select id="signalType">
          <option value="white">White noise</option>
          <option value="pink">Pink noise</option>
          <option value="sine">Sine 1 kHz</option>
        </select>
        <div class="spacer"></div>
        <div class="row slider-row">
          <label for="volume">Volume</label>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.2" />
        </div>
        <div class="spacer"></div>
        <label for="outputDevice">Output</label>
        <select id="outputDevice"></select>
      </div>
      <div class="row" style="margin-top:10px; gap: 10px;">
        <button id="playBtn" class="btn-secondary" type="button">Play Test Signal</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Input</legend>
      <div class="row">
        <label for="inputDevice">Input</label>
        <select id="inputDevice"></select>
        <div class="spacer"></div>
        <button id="initBtn" class="btn-secondary" type="button">Initialize / Refresh Devices</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Filename Builder</legend>
      <div class="three-col">
        <div class="col" data-col="0">
          <h3 class="col-name" id="colName0" contenteditable="true" spellcheck="false">Column 1</h3>
          <ul id="col0" class="list"></ul>
          <div class="adder">
            <input id="add0" type="text" placeholder="Add value" />
            <button id="btnAdd0" class="btn-secondary" type="button">Add</button>
          </div>
        </div>
        <div class="col" data-col="1">
          <h3 class="col-name" id="colName1" contenteditable="true" spellcheck="false">Column 2</h3>
          <ul id="col1" class="list"></ul>
          <div class="adder">
            <input id="add1" type="text" placeholder="Add value" />
            <button id="btnAdd1" class="btn-secondary" type="button">Add</button>
          </div>
        </div>
        <div class="col" data-col="2">
          <h3 class="col-name" id="colName2" contenteditable="true" spellcheck="false">Column 3</h3>
          <ul id="col2" class="list"></ul>
          <div class="adder">
            <input id="add2" type="text" placeholder="Add value" />
            <button id="btnAdd2" class="btn-secondary" type="button">Add</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Record</legend>
      <div class="row" style="gap: 10px;">
        <button id="recordBtn" class="btn-primary" type="button">Record (5s, 24-bit WAV)</button>
        <span class="muted">Starts signal, waits 0.5s, records 5s mono, then saves.</span>
      </div>
      <div class="status" id="status"></div>
    </fieldset>

    <fieldset>
      <legend>Spectrum</legend>
      <div class="spectrum-wrap">
        <div class="spectrum-toolbar">
          <label for="fftSize">FFT size</label>
          <input id="fftSize" type="range" min="0" max="5" step="1" value="2" />
          <span class="muted" id="fftLabel">4096</span>
          <label for="smoothSize" style="margin-left:10px;">Smoothing</label>
          <input id="smoothSize" type="range" min="0" max="100" step="1" value="0" />
          <span class="muted" id="smoothLabel">0</span>
          <div class="right">
            <button id="toggleView" class="btn-secondary" type="button">Show Impulse</button>
            <button id="resetView" class="btn-reset" type="button">Reset View</button>
          </div>
        </div>
        <canvas id="spectrumCanvas"></canvas>
        <div class="muted" style="margin-top:6px;">Scroll to zoom, click-drag to pan. Log frequency (20 Hz – 24 kHz) and dB scale.</div>
      </div>
    </fieldset>
  </div>
</body>
</html>
