<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Audio Capture Assistant</title>
  <link rel="stylesheet" href="./styles.css">
  <meta http-equiv="origin-trial" content="">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>IR Capture Assistant</h1>

    <div class="two-col">
      <fieldset>
        <legend>Test Signal</legend>
        <div class="form-vertical">
          <div class="form-row">
            <label for="signalType">Signal</label>
            <select id="signalType">
              <option value="white">White noise</option>
              <option value="pink">Pink noise</option>
              <option value="sine">Sine 1 kHz</option>
            </select>
          </div>
          <div class="form-row">
            <label for="volume">Volume</label>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.2" />
          </div>
          <div class="form-row">
            <label for="outputDevice">Output</label>
            <select id="outputDevice"></select>
          </div>
          <div class="form-actions">
            <button id="playBtn" class="btn-secondary" type="button">Play Test Signal</button>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Input</legend>
        <div class="form-vertical">
          <div class="form-row">
            <label for="inputDevice">Input</label>
            <select id="inputDevice"></select>
          </div>
          <div class="form-row">
            <label for="inputChannel">Channel</label>
            <select id="inputChannel">
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </div>
          <div class="form-row">
            <label for="sampleRateSel">Sample rate</label>
            <select id="sampleRateSel">
              <option value="44100">44,100 Hz</option>
              <option value="48000" selected>48,000 Hz</option>
              <option value="96000">96,000 Hz</option>
            </select>
          </div>
          <div class="form-actions input-actions">
            <button id="initBtn" class="btn-secondary" type="button">Initialize / Refresh Devices</button>
            <div class="meter" title="Input peak level">
              <div class="meter-track"><div id="meterFill" class="meter-fill"></div></div>
              <div id="meterLabel" class="meter-label">-∞ dB</div>
            </div>
          </div>
        </div>
      </fieldset>
    </div>

    <fieldset>
      <legend>Filename Builder</legend>
      <div class="three-col">
        <div class="col" data-col="0">
          <h3 class="col-name" id="colName0" contenteditable="true" spellcheck="false">Column 1</h3>
          <ul id="col0" class="list"></ul>
          
        </div>
        <div class="col" data-col="1">
          <h3 class="col-name" id="colName1" contenteditable="true" spellcheck="false">Column 2</h3>
          <ul id="col1" class="list"></ul>
          
        </div>
        <div class="col" data-col="2">
          <h3 class="col-name" id="colName2" contenteditable="true" spellcheck="false">Column 3</h3>
          <ul id="col2" class="list"></ul>
          
        </div>
      </div>
      <div class="adder-row">
        <div class="adder">
          <input id="add0" type="text" placeholder="Add value" />
          <button id="btnAdd0" class="btn-secondary" type="button">Add</button>
        </div>
        <div class="adder">
          <input id="add1" type="text" placeholder="Add value" />
          <button id="btnAdd1" class="btn-secondary" type="button">Add</button>
        </div>
        <div class="adder">
          <input id="add2" type="text" placeholder="Add value" />
          <button id="btnAdd2" class="btn-secondary" type="button">Add</button>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Capture</legend>
      <div class="row row-gap-10">
        <button id="recordBtn" class="btn-primary" type="button">Capture (5s, 24-bit WAV)</button>
      </div>
      <div class="status" id="status"></div>
    </fieldset>

    <fieldset>
      <legend>Spectrum</legend>
      <div class="spectrum-wrap">
        <div class="spectrum-toolbar">
          <div class="spectrum-controls">
            <label for="fftSize">FFT size</label>
            <input id="fftSize" type="range" min="0" max="5" step="1" value="2" />
            <span class="muted" id="fftLabel">4096</span>
            <label for="smoothSize">Smoothing</label>
            <input id="smoothSize" type="range" min="0" max="100" step="1" value="0" />
            <span class="muted" id="smoothLabel">0</span>
            <label for="irSize">IR Size</label>
            <input id="irSize" type="range" min="0" max="3" step="1" value="2" />
            <span class="muted" id="irSizeLabel">4096</span>
          </div>
          <div class="spectrum-actions">
            <button id="exportSpectrum" class="btn-secondary" type="button">Export Spectrum</button>
            <button id="exportIR" class="btn-secondary" type="button">Export IR</button>
            <button id="autoExportToggle" class="btn-secondary" type="button">Auto Export: On</button>
            <button id="toggleView" class="btn-secondary" type="button">Show Impulse</button>
            <button id="resetView" class="btn-reset" type="button">Reset View</button>
          </div>
        </div>
        <canvas id="spectrumCanvas"></canvas>
        <div class="muted mt-6">Scroll to zoom, click-drag to pan. Log frequency (20 Hz – 24 kHz) and dB scale.</div>
      </div>
    </fieldset>
  </div>
</body>
</html>
